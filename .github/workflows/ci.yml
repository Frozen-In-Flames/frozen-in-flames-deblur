# CI for frozen-in-flames-deblur.
# Python command from README.md, "Tests":
#   python -m pytest tests/ -q
# Dependencies from requirements.txt (pytest is listed there as a
# test-only requirement). The Node suite is documented in the README
# and in web-test/live_math.test.mjs itself:
#   node web-test/live_math.test.mjs
# Added under the November 2026 audit follow-through.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "pytest>=8.0"
      - name: Run Python tests
        run: python -m pytest tests/ -q
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Node tests
        run: node web-test/live_math.test.mjs
